name: DIDRF
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - setuptools
  - wheel

  # Core scientific stack. Installed by conda so Windows gets prebuilt binaries.
  - numpy=1.22.2
  - scipy=1.8.0
  - pandas=1.4.1
  - matplotlib=3.5.1
  - statsmodels=0.13.2
  - quadprog=0.1.11

  # Runtime / utility packages used by the project.
  - joblib=1.1.0
  - networkx=2.7.1
  - pillow=9.0.1
  - psutil=5.9.0
  - requests=2.28.1
  - pytz=2021.3
  - python-dateutil=2.8.2
  - pyparsing=3.0.4
  - packaging=21.3
  - six=1.16.0

  - pip:
      - absl-py==1.2.0
      - astunparse==1.6.3
      - cachetools==5.2.0
      - charset-normalizer==2.1.0
      - flatbuffers==1.12
      - gast==0.4.0
      - google-auth==2.9.1
      - google-auth-oauthlib==0.4.6
      - google-pasta==0.2.0
      - grpcio==1.47.0
      - h5py==3.7.0
      - idna==3.3
      - keras==2.9.0
      - keras-preprocessing==1.1.2
      - libclang==14.0.6
      - markdown==3.4.1
      - mip==1.12.0
      - oauthlib==3.2.0
      - opt-einsum==3.3.0
      - progressbar2==4.0.0
      - protobuf==3.19.4
      - pyasn1==0.4.8
      - pyasn1-modules==0.2.8
      - python-utils==3.1.0
      - qpsolvers==1.8.0
      - requests-oauthlib==1.3.1
      - rsa==4.9
      - sharedmem==0.3.8
      - str2bool==1.1
      - tensorboard==2.9.1
      - tensorboard-data-server==0.6.1
      - tensorboard-plugin-wit==1.8.1
      - tensorflow==2.9.1
      - tensorflow-estimator==2.9.0
      - tensorflow-io-gcs-filesystem==0.26.0
      - termcolor==1.1.0
      - typing-extensions==4.3.0
      - urllib3==1.26.11
      - werkzeug==2.2.1
      - wrapt==1.14.1
